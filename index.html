<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soomin &amp; Edgar — RSVP</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Jost:wght@400;500;600&family=Montserrat:wght@500;600;700&family=Nanum+Myeongjo:wght@400;700;800&display=swap');

:root{
  --ivory:#FAF7F2;
  --ivory-2:#F3EEE5;
  --blue:#A9C6D9;
  --blue-deep:#7FA5BE;
  --ink:#26384A;
  --ink-soft:#5A6B7B;
  --gold:#C6A15B;
  --gold-soft:#E4D3AC;
  --error:#B4553F;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--ivory);
  background-image:
    radial-gradient(circle at 15% 10%, var(--blue) 0%, transparent 45%),
    radial-gradient(circle at 85% 90%, var(--blue) 0%, transparent 40%);
  background-attachment:fixed;
  font-family:'Jost',sans-serif;
  color:var(--ink);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:32px 16px;
}

.card{
  position:relative;
  width:100%;
  max-width:520px;
  background:#FFFFFF;
  border:1.5px solid var(--ink);
  padding:44px 36px 40px;
  box-shadow:0 2px 0 var(--gold), 0 22px 50px -20px rgba(38,56,74,0.35);
}
.card::before{
  content:"";
  position:absolute;
  inset:10px;
  border:1px solid var(--gold-soft);
  pointer-events:none;
}

.lang-toggle{
  position:absolute;
  top:14px;
  right:14px;
  display:flex;
  flex-wrap:wrap;
  justify-content:flex-end;
  gap:4px;
  max-width:150px;
  font-family:'Jost',sans-serif;
  font-size:10px;
  letter-spacing:0.04em;
  z-index:2;
}
.lang-toggle button{
  background:none;
  border:1px solid var(--ink);
  color:var(--ink);
  padding:4px 7px;
  cursor:pointer;
  font-family:inherit;
  font-size:inherit;
  letter-spacing:inherit;
  white-space:nowrap;
}
.lang-toggle button.active{
  background:var(--ink);
  color:var(--ivory);
}

.seal{
  width:100%;
  max-width:280px;
  height:auto;
  margin:6px auto 18px;
  display:block;
}

.eyebrow{
  text-align:center;
  font-size:10.5px;
  letter-spacing:0.22em;
  text-transform:uppercase;
  color:var(--gold);
  font-weight:600;
  margin-bottom:10px;
}

h1{
  font-family:'Montserrat',sans-serif;
  font-weight:700;
  text-align:center;
  font-size:38px;
  line-height:1.15;
  margin:0 0 6px;
  color:var(--ink);
}

.lang-kr .eyebrow,
.lang-kr h1,
.lang-kr .subline{
  font-family:'Nanum Myeongjo',serif;
}
.lang-kr h1{ font-weight:800; }

.subline{
  text-align:center;
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  font-size:16px;
  color:var(--ink-soft);
  margin:0 0 22px;
}

.details{
  text-align:center;
  font-size:12.5px;
  letter-spacing:0.04em;
  color:var(--ink-soft);
  line-height:1.7;
  margin-bottom:6px;
}
.details strong{color:var(--ink); font-weight:600;}

hr.rule{
  border:none;
  border-top:1px solid var(--gold-soft);
  margin:26px 0 24px;
}

form{display:flex; flex-direction:column; gap:20px;}

label.field-label{
  font-size:11px;
  letter-spacing:0.12em;
  text-transform:uppercase;
  color:var(--ink-soft);
  font-weight:500;
  display:block;
  margin-bottom:8px;
}

input[type="text"]{
  width:100%;
  border:none;
  border-bottom:1.5px solid var(--ink);
  background:transparent;
  padding:8px 2px;
  font-family:'Cormorant Garamond',serif;
  font-size:19px;
  color:var(--ink);
  outline:none;
}
input[type="text"]:focus{border-bottom-color:var(--gold);}
input[type="text"]::placeholder{color:#B9C2CB; font-style:italic;}

.pill-group{
  display:flex;
  gap:10px;
}
.pill{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  line-height:1.35;
  padding:11px 10px;
  border:1.5px solid var(--ink);
  cursor:pointer;
  font-size:13px;
  letter-spacing:0.05em;
  background:var(--ivory);
  color:var(--ink);
  transition:background .15s, color .15s, border-color .15s;
  user-select:none;
}
.pill:hover{border-color:var(--gold);}
.pill.selected{
  background:var(--ink);
  border-color:var(--ink);
  color:var(--ivory);
}
.pill.selected.no-variant{
  background:var(--ivory-2);
  color:var(--ink);
  border-color:var(--ink);
}
.pill[data-attend]{
  font-family:'Montserrat',sans-serif;
  font-weight:600;
}

.sub-field{
  border-left:2px solid var(--gold-soft);
  padding-left:16px;
  margin-top:-4px;
  display:none;
  flex-direction:column;
  gap:16px;
}
.sub-field.visible{display:flex;}

.stepper{
  display:flex;
  align-items:center;
  gap:16px;
}
.stepper-btn{
  width:36px;
  height:36px;
  border:1.5px solid var(--ink);
  background:var(--ivory);
  color:var(--ink);
  font-size:16px;
  line-height:1;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:background .15s, color .15s, border-color .15s;
  user-select:none;
}
.stepper-btn:hover:not(:disabled){border-color:var(--gold);}
.stepper-btn:active:not(:disabled){background:var(--ink); color:var(--ivory);}
.stepper-btn:disabled{opacity:0.35; cursor:not-allowed;}
.stepper-value{
  min-width:28px;
  text-align:center;
  font-family:'Cormorant Garamond',serif;
  font-size:22px;
  color:var(--ink);
}

button.submit{
  margin-top:6px;
  background:var(--ink);
  color:var(--ivory);
  border:none;
  padding:14px 0;
  font-family:'Jost',sans-serif;
  font-size:12.5px;
  letter-spacing:0.14em;
  text-transform:uppercase;
  cursor:pointer;
  transition:background .15s;
}
button.submit:hover{background:var(--blue-deep);}
button.submit:disabled{opacity:0.5; cursor:not-allowed;}

.msg{
  text-align:center;
  font-size:12.5px;
  color:var(--error);
  min-height:16px;
  margin-top:-6px;
}

.confirmation{
  text-align:center;
  padding:14px 6px 4px;
}
.confirmation .seal{margin-bottom:14px;}
.confirmation h2{
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  font-weight:500;
  font-size:24px;
  margin:0 0 8px;
  color:var(--ink);
}
.confirmation p{
  font-size:13px;
  color:var(--ink-soft);
  line-height:1.6;
  margin:0;
}

.hidden{display:none !important;}

/* Landing / illustration reveal */
.landing{
  width:100%;
  max-width:520px;
  margin:0 auto 40px;
  text-align:center;
}
.landing-img-wrap{
  position:relative;
  width:100%;
  max-width:360px;
  margin:0 auto;
  cursor:pointer;
}
.landing-img-wrap.revealed{cursor:default;}
.landing-img-wrap img{
  display:block;
  width:100%;
  border:1.5px solid var(--ink);
  box-shadow:0 22px 50px -20px rgba(38,56,74,0.35);
}
.landing-img-wrap .real-photo{
  position:absolute;
  top:0; left:0;
  opacity:0;
  transition:opacity 1.1s ease;
  pointer-events:none;
}
.landing-img-wrap .illustration{
  transition:opacity 1.1s ease;
  opacity:1;
}
.landing-img-wrap.revealed .illustration{opacity:0;}
.landing-img-wrap.revealed .real-photo{opacity:1;}

.invited-text{
  font-family:'Alex Brush',cursive;
  font-weight:400;
  font-size:52px;
  color:var(--ink);
  margin:22px 0 6px;
}
.click-hint{
  font-family:'Jost',sans-serif;
  font-size:12px;
  letter-spacing:0.1em;
  text-transform:uppercase;
  color:var(--gold);
  margin:0;
  transition:opacity .5s ease;
}
.click-hint.hidden-hint{opacity:0;}

#app{
  display:none;
  opacity:0;
  transition:opacity .9s ease;
}
#app.revealed{
  display:block;
  opacity:1;
}

/* Admin view */
.admin-wrap{max-width:640px;}
.admin-wrap table{width:100%; border-collapse:collapse; font-size:13px; margin-top:18px;}
.admin-wrap th, .admin-wrap td{
  text-align:left;
  padding:9px 8px;
  border-bottom:1px solid var(--ivory-2);
}
.admin-wrap th{
  font-size:10.5px;
  letter-spacing:0.1em;
  text-transform:uppercase;
  color:var(--ink-soft);
  border-bottom:1.5px solid var(--ink);
}
.tag-yes, .tag-no{
  display:inline-block;
  padding:2px 8px;
  font-size:11px;
  letter-spacing:0.05em;
  border:1px solid var(--ink);
}
.tag-no{color:var(--ink-soft); border-color:var(--ivory-2);}
.admin-summary{
  display:flex;
  gap:22px;
  justify-content:center;
  margin-top:8px;
  font-size:12.5px;
  color:var(--ink-soft);
}
.admin-summary strong{color:var(--ink); font-size:17px; display:block; font-family:'Cormorant Garamond',serif;}
.back-link{
  display:block;
  text-align:center;
  margin-top:26px;
  font-size:11.5px;
  letter-spacing:0.08em;
  color:var(--ink-soft);
  text-decoration:none;
  border-top:1px solid var(--ivory-2);
  padding-top:16px;
}
.empty-state{text-align:center; color:var(--ink-soft); font-size:13px; margin-top:24px; font-style:italic; font-family:'Cormorant Garamond',serif;}
</style>

let lang = "en";
let attending = null;      // true / false
let plusOne = null;        // true / false
let extraGuestsCount = 0;  // 0-6
let submitted = false;

let guestNameVal = "";     // preserved across re-renders triggered by pill/stepper clicks

function t(key){ return STR[lang][key]; }

function render(){
  const isAdmin = window.location.hash === "#admin";
  document.getElementById("app").innerHTML = isAdmin ? renderAdmin() : renderForm();
  if(!isAdmin){
    applyCardMinHeight();
    attachFormHandlers();
  }
  if(isAdmin) loadAdminData();
}

function applyCardMinHeight(){
  // Measures the card's natural height in all three languages (with the current
  // attending/plusOne/extraGuests state) and locks the visible card to the tallest,
  // so switching EN/ES/KR never changes the box size.
  const liveCard = document.querySelector('#app .card');
  if(!liveCard) return;
  if(liveCard.offsetParent === null) return; // not visible yet (e.g. behind landing reveal)

  liveCard.style.minHeight = '';
  const vw = document.documentElement.clientWidth;
  const width = Math.min(vw - 32, 520); // matches body padding (16px*2) and .card max-width
  if(!width) return;

  const probe = document.createElement('div');
  probe.style.position = 'absolute';
  probe.style.visibility = 'hidden';
  probe.style.left = '-9999px';
  probe.style.top = '0';
  probe.style.width = width + 'px';
  document.body.appendChild(probe);

  const originalLang = lang;
  let maxH = 0;
  ['en','es','kr'].forEach(code=>{
    lang = code;
    probe.innerHTML = renderForm();
    const c = probe.querySelector('.card');
    if(c && c.scrollHeight > maxH) maxH = c.scrollHeight;
  });
  lang = originalLang;
  document.body.removeChild(probe);

  if(maxH) liveCard.style.minHeight = maxH + 'px';
}

let _resizeTimer = null;
window.addEventListener('resize', ()=>{
  clearTimeout(_resizeTimer);
  _resizeTimer = setTimeout(applyCardMinHeight, 150);
});
if(document.fonts && document.fonts.ready){
  document.fonts.ready.then(()=>{ applyCardMinHeight(); });
}

function renderForm(){
  if(submitted){
    const title = submittedAttending ? t("confirmYesTitle") : t("confirmNoTitle");
    const body = submittedAttending ? t("confirmYesBody") : t("confirmNoBody");
    return `
      <div class="card">
        ${langToggleHTML()}
        <div class="confirmation">
          <div class="seal">${SVG_SEAL}</div>
          <h2>${title}</h2>
          <p>${body}</p>
        </div>
      </div>`;
  }

  return `
    <div class="card ${lang==='kr' ? 'lang-kr' : ''}">
      ${langToggleHTML()}
      <div class="seal">${SVG_SEAL}</div>
      <div class="eyebrow">${t("eyebrow")}</div>
      <h1>${t("title")}</h1>
      <div class="subline">${t("subline")}</div>
      <div class="details">${t("details")}</div>
      <hr class="rule"/>
      <form id="rsvpForm" novalidate>
        <div>
          <label class="field-label">${t("nameLabel")}</label>
          <input type="text" id="guestName" placeholder="${t("namePlaceholder")}" autocomplete="name" value="${escapeHtml(guestNameVal)}">
        </div>

        <div>
          <label class="field-label">${t("attendLabel")}</label>
          <div class="pill-group">
            <div class="pill ${attending===true?'selected':''}" data-attend="yes">${t("yes")}</div>
            <div class="pill ${attending===false?'selected no-variant':''}" data-attend="no">${t("no")}</div>
          </div>
        </div>

        <div class="sub-field ${attending===true?'visible':''}" id="plusOneBlock">
          <div>
            <label class="field-label">${t("plusOneLabel")}</label>
            <div class="pill-group">
              <div class="pill ${plusOne===true?'selected':''}" data-plusone="yes">${t("plusOneYes")}</div>
              <div class="pill ${plusOne===false?'selected no-variant':''}" data-plusone="no">${t("plusOneNo")}</div>
            </div>
          </div>
          <div class="sub-field ${plusOne===true?'visible':''}" id="plusOneNameBlock" style="border-left:none; padding-left:0; margin-top:0;">
            <div style="width:100%;">
              <label class="field-label">${t("extraGuestsLabel")}</label>
              <div class="stepper">
                <button type="button" class="stepper-btn" id="stepDown" ${extraGuestsCount<=0?'disabled':''} aria-label="decrease">&minus;</button>
                <span class="stepper-value" id="stepperValue">${extraGuestsCount}</span>
                <button type="button" class="stepper-btn" id="stepUp" ${extraGuestsCount>=6?'disabled':''} aria-label="increase">+</button>
              </div>
            </div>
          </div>
        </div>

        <div class="msg" id="formMsg"></div>
        <button type="submit" class="submit">${t("submit")}</button>
      </form>
    </div>`;
}

function langToggleHTML(){
  return `
    <div class="lang-toggle">
      <button type="button" data-lang="en" class="${lang==='en'?'active':''}">EN</button>
      <button type="button" data-lang="es" class="${lang==='es'?'active':''}">Español</button>
      <button type="button" data-lang="kr" class="${lang==='kr'?'active':''}">한국어</button>
    </div>`;
}

function attachFormHandlers(){
  document.querySelectorAll('[data-lang]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ syncNameField(); lang = btn.dataset.lang; render(); });
  });

  document.querySelectorAll('[data-attend]').forEach(pill=>{
    pill.addEventListener('click', ()=>{
      syncNameField();
      attending = pill.dataset.attend === 'yes';
      if(!attending){ plusOne = null; extraGuestsCount = 0; }
      render();
    });
  });

  const plusOnePills = document.querySelectorAll('[data-plusone]');
  plusOnePills.forEach(pill=>{
    pill.addEventListener('click', ()=>{
      syncNameField();
      plusOne = pill.dataset.plusone === 'yes';
      if(!plusOne){ extraGuestsCount = 0; }
      render();
    });
  });

  const stepDown = document.getElementById('stepDown');
  const stepUp = document.getElementById('stepUp');
  if(stepDown){
    stepDown.addEventListener('click', ()=>{
      syncNameField();
      extraGuestsCount = Math.max(0, extraGuestsCount - 1);
      render();
    });
  }
  if(stepUp){
    stepUp.addEventListener('click', ()=>{
      syncNameField();
      extraGuestsCount = Math.min(6, extraGuestsCount + 1);
      render();
    });
  }

  const form = document.getElementById('rsvpForm');
  if(form){
    form.addEventListener('submit', handleSubmit);
  }
}

function syncNameField(){
  const nameEl = document.getElementById('guestName');
  if(nameEl) guestNameVal = nameEl.value;
}

async function handleSubmit(e){
  e.preventDefault();
  const nameInput = document.getElementById('guestName');
  const name = nameInput.value.trim();
  const msgEl = document.getElementById('formMsg');
  const btn = e.target.querySelector('button.submit');

  if(!name){ msgEl.textContent = t("errorName"); return; }
  if(attending === null){ msgEl.textContent = t("errorAttend"); return; }
  msgEl.textContent = "";

  const record = {
    name: name,
    attending: attending,
    plusOne: attending ? !!plusOne : false,
    extraGuests: (attending && plusOne) ? extraGuestsCount : 0,
    submittedAt: new Date().toISOString(),
    lang: lang
  };

  btn.disabled = true;
  try{
    const response = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids CORS preflight; Apps Script reads raw body regardless
      body: JSON.stringify(record)
    });
    if(!response.ok){ throw new Error('Network response was not ok: ' + response.status); }
    submitted = true;
    submittedAttending = attending;
    render();
  }catch(err){
    console.error('RSVP save failed:', err);
    msgEl.textContent = t("saveError");
    btn.disabled = false;
  }
}

function renderAdmin(){
  return `
    <div class="card admin-wrap">
      <div class="eyebrow">Admin</div>
      <h1 style="font-size:28px;">RSVP Responses</h1>
      <div id="adminBody">
        <p class="empty-state">Loading…</p>
      </div>
      <a href="#" class="back-link" onclick="window.location.hash=''; return false;">← Back to RSVP form</a>
    </div>`;
}

async function loadAdminData(){
  const body = document.getElementById('adminBody');
  try{
    const response = await fetch(APPS_SCRIPT_URL, { method: 'GET' });
    if(!response.ok){ throw new Error('Network response was not ok: ' + response.status); }
    const records = await response.json();
    if(!records || records.length === 0){
      body.innerHTML = '<p class="empty-state">No responses yet.</p>';
      return;
    }
    records.sort((a,b)=> new Date(a.submittedAt) - new Date(b.submittedAt));

    const yesCount = records.filter(r=>r.attending).length;
    const noCount = records.length - yesCount;
    const plusOnes = records.filter(r=>r.attending && r.plusOne).length;
    const totalExtraGuests = records.reduce((sum,r)=> sum + (r.attending && r.plusOne ? (r.extraGuests||0) : 0), 0);

    let rows = records.map(r => `
      <tr>
        <td>${escapeHtml(r.name)}</td>
        <td>${r.attending ? '<span class="tag-yes">Attending</span>' : '<span class="tag-no">Not attending</span>'}</td>
        <td>${r.attending && r.plusOne ? ('Yes (' + (r.extraGuests||0) + ')') : '—'}</td>
      </tr>`).join('');

    body.innerHTML = `
      <div class="admin-summary">
        <div><strong>${records.length}</strong>Responses</div>
        <div><strong>${yesCount}</strong>Attending</div>
        <div><strong>${noCount}</strong>Declined</div>
        <div><strong>${plusOnes}</strong>Plus ones</div>
        <div><strong>${totalExtraGuests}</strong>Extra guests</div>
      </div>
      <table>
        <thead><tr><th>Guest</th><th>Status</th><th>Plus one</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
  }catch(err){
    console.error('Failed to load admin data:', err);
    body.innerHTML = '<p class="empty-state">Could not load responses.</p>';
  }
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

window.addEventListener('hashchange', render);
render();

// Landing illustration -> photo reveal, then show RSVP section below
(function(){
  const wrap = document.getElementById('landingImgWrap');
  const hint = document.getElementById('clickHint');
  const app = document.getElementById('app');
  if(!wrap) return;
  let revealed = false;
  wrap.addEventListener('click', ()=>{
    if(revealed) return;
    revealed = true;
    wrap.classList.add('revealed');
    if(hint) hint.classList.add('hidden-hint');
    if(app){
      app.style.display = 'block';
      // force reflow so the opacity transition actually plays
      void app.offsetHeight;
      app.classList.add('revealed');
      applyCardMinHeight();
    }
  });
})();
</script>
